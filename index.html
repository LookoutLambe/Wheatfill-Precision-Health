<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report real values.
         Without it those insets resolve to 0 and, installed to the iPhone home screen,
         the bottom dock and drawers sit under the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; form-action 'self'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https: http:;"
    />
    <meta name="theme-color" content="#0b1524" />
    <meta name="application-name" content="Wheatfill Precision Health" />
    <!-- Android / Chrome install & standalone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WPH" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&family=Inter:wght@400..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <meta

      content="Personalized, evidence-based telehealth care for metabolic optimization, GLP-1 weight management, and advanced wellness therapies. Board-certified FNP-C, licensed in Utah. Precision health. Elevated living."
    />
    <link rel="canonical" href="https://wheatfillprecisionhealth.com/" />

    <!-- Social sharing (Open Graph + Twitter) — read by scrapers from static HTML. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wheatfill Precision Health" />
    <meta property="og:url" content="https://wheatfillprecisionhealth.com/" />
    <meta property="og:title" content="Wheatfill Precision Health — Telehealth GLP-1 & Metabolic Care" />
    <meta
      property="og:description"
      content="Personalized, evidence-based telehealth care for metabolic optimization, weight management, and longevity. Licensed in Utah. Precision health. Elevated living."
    />
    <meta property="og:image" content="https://wheatfillprecisionhealth.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wheatfill Precision Health — Precision Health. Elevated Living." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wheatfill Precision Health — Telehealth GLP-1 & Metabolic Care" />
    <meta

      content="Personalized, evidence-based telehealth care for metabolic optimization, weight management, and longevity. Licensed in Utah."
    />
    <meta name="twitter:image" content="https://wheatfillprecisionhealth.com/og-image.png" />

    <!-- Local business structured data for search engines. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalClinic",
        "name": "Wheatfill Precision Health",
        "url": "https://wheatfillprecisionhealth.com/",
        "logo": "https://wheatfillprecisionhealth.com/app-icon.png",
        "image": "https://wheatfillprecisionhealth.com/og-image.png",
        "description": "Telehealth practice specializing in metabolic optimization, GLP-1 weight management, and advanced wellness therapies. Board-certified FNP-C, licensed in Utah.",
        "slogan": "Precision Health. Elevated Living.",
        "areaServed": {
          "@type": "State",
          "name": "Utah"
        },
        "priceRange": "$85 - $300"
      }
    </script>
    <script>
      // Use HTTPS on the live site (avoids “Not secure” when users or links hit http://).
      (function () {
        var h = location.hostname
        if (location.protocol !== 'http:' || !h || h === 'localhost' || h === '127.0.0.1') return
        location.replace(location.href.replace(/^http:/, 'https:'))
      })()
    </script>
    <script>
      // If we arrived here via the 404.html SPA redirect on GitHub Pages,
      // restore the original URL so React Router can render the right route.
      (function () {
        var redirect = sessionStorage.getItem('wph_redirect');
        if (!redirect) return;
        sessionStorage.removeItem('wph_redirect');
        // Custom domain uses basename "/"; strip legacy GitHub project-path prefix if present.
        var stripped = redirect.replace(/^\/Wheatfill-Precision-Health(?=\/|\?|#|$)/i, '') || '/';
        if (stripped.charAt(0) !== '/') stripped = '/' + stripped;
        window.history.replaceState(null, '', stripped);
      })();
    </script>
  </head>

    <a class="skipToMain" href="#wph-main">Skip to main content</a>
