name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a run that may already be publishing — a half-finished Pages deployment is worse
  # than a queued one. Queue instead.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Fails the deploy if the storefront catalog and the server's product table disagree.
      # They drifted once in production: five SKUs were unsellable and shipping reconciled $10 short.
      - name: Check catalog/server price sync
        run: npm run check:catalog

      - name: Build
        env:
          VITE_MARKETING_ONLY: "1"
          # Public marketing site + deep links; matches custom domain in public/CNAME. Override with repo secret if needed.
          VITE_APP_URL: ${{ secrets.VITE_APP_URL || 'https://wheatfillprecisionhealth.com' }}
          # Public API for /book, /contact, order flows, etc. (https, no trailing slash). Not defaulted here—
          # only provider area uses a code fallback; set this secret so the whole static site can reach the API.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Second Web3Forms recipient key (kept out of source by owner request; set as a repo secret).
          VITE_WEB3FORMS_KEY_2: ${{ secrets.WEB3FORMS_KEY_2 }}
        run: npm run build:marketing

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Runs here as well as in e2e.yml: `needs:` cannot reference another workflow, so a red run in
  # "E2E smoke" could not stop this deploy. Commit 8234aa0 shipped to production with a failing
  # suite for exactly that reason.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test

  deploy:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

